openapi: 3.1.0
info:
  title: Yori Dict API
  version: 1.0.0
  description: >-
    Independent Japanese and English dictionary lookup with authenticated on-demand
    enrichment. Every lookup names one dictionary and one explanation language;
    there is no default and no fallback between languages.
  license:
    name: MIT for code; CC BY-SA 4.0 for dictionary data
    url: https://github.com/YoriJP/yori-dict/blob/main/DATA_SOURCES.md
servers:
  - url: https://{host}
    description: Railway deployment
    variables:
      host:
        default: yori-dict-production.up.railway.app
  - url: http://localhost:3000
    description: Local development server
paths:
  /:
    get:
      summary: API index
      operationId: getIndex
      responses:
        "200":
          description: Basic service links and public artifacts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexResponse"
              example:
                name: Yori Dict
                description: Open Japanese and English dictionary lookup backed by independent data releases.
                health: /health
                meta: /v1/meta
                lookup: "/v1/lookup?q=食べました&dictionary=ja&lang=zh-tw"
                batchLookup: /v1/lookup/batch
                docs: /doc
                openapi: /openapi.yaml
                dataRelease: https://github.com/YoriJP/yori-dict/releases/tag/data-2026-08-04.3
  /doc:
    get:
      summary: API documentation
      operationId: getApiDocs
      responses:
        "200":
          description: Scalar API reference HTML page for this API.
          content:
            text/html:
              schema:
                type: string
  /openapi.yaml:
    get:
      summary: OpenAPI YAML document
      operationId: getOpenApiYaml
      responses:
        "200":
          description: Raw OpenAPI YAML document for this API.
          content:
            application/yaml:
              schema:
                type: string
              example: "openapi: 3.1.0\ninfo:\n  title: Yori Dict API\n"
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: The API is running.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
              example:
                ok: true
  /v1/meta:
    get:
      summary: Dictionary metadata
      operationId: getMeta
      responses:
        "200":
          description: API version, dictionary version, supported languages, and data sources.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaResponse"
              example:
                apiVersion: v1
                dictionaryVersion: "2026-06-01"
                languages: [en, de, zh-tw, zh-cn, ko]
                tags:
                  uk: word usually written using kana alone
                  vt: transitive verb
                  ksb: Kansai-ben
                sources:
                  - name: JMdict
                    license: CC-BY-SA-4.0
                    url: https://www.edrdg.org/wiki/index.php/JMdict-EDICT_Dictionary_Project
                  - name: Tatoeba example sentences
                    license: CC BY 2.0 FR
                    url: https://tatoeba.org/
                  - name: yomitan-jlpt-vocab estimated levels
                    license: CC BY-SA 4.0
                    url: https://github.com/stephenmk/yomitan-jlpt-vocab
                  - name: Yori generated zh-TW glosses (legacy records)
                    license: CC-BY-SA-4.0
                    url: sources/ai-glosses/zh-tw.jsonl
                  - name: Yori generated zh-CN glosses (legacy records)
                    license: CC-BY-SA-4.0
                    url: sources/ai-glosses/zh-cn.jsonl
                  - name: Yori generated Korean glosses (legacy records)
                    license: CC-BY-SA-4.0
                    url: sources/ai-glosses/ko.jsonl
  /v1/lookup:
    get:
      summary: Look up one term in an independent dictionary
      operationId: lookup
      parameters:
        - name: q
          in: query
          required: true
          description: Japanese word, reading, or inflected form.
          schema:
            type: string
          example: 食べました
        - name: dictionary
          in: query
          required: true
          description: Independent headword dictionary to query. There is no default.
          schema:
            type: string
            enum: [ja, en]
        - name: lang
          in: query
          required: true
          description: >-
            Explanation language of the returned meanings. There is no default and no
            fallback. `ja` supports en, de, zh-tw, zh-cn, and ko; `en` currently
            supports en. Any other combination is a request error.
          schema:
            $ref: "#/components/schemas/ApiLang"
          example: zh-tw
        - name: enrich
          in: query
          required: false
          description: Resolve missing entries and fill missing examples. Requires bearer authentication.
          schema:
            type: boolean
            default: false
        - name: lemma
          in: query
          required: false
          description: Consumer-supplied lemma hint used only during authenticated enrichment.
          schema:
            type: string
        - name: reading
          in: query
          required: false
          description: Consumer-supplied Japanese reading hint used only during authenticated enrichment.
          schema:
            type: string
        - name: context
          in: query
          required: false
          description: Sentence containing the candidate, used only for enrichment eligibility and disambiguation.
          schema:
            type: string
      responses:
        "200":
          description: >-
            The entry in the requested explanation language, or null when no acceptable
            content exists for that dictionary and language.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LookupResult"
        "400":
          description: Missing query, dictionary, or explanation language, or an unsupported combination.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Missing required query parameter: q"
        "401":
          description: Enrichment was requested without the configured bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: >-
            A database, persistence, configuration, or model-provider failure. Operational
            failures stay errors and never become a null entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/lookup/batch:
    post:
      summary: Look up multiple terms in an independent dictionary
      operationId: batchLookup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchLookupRequest"
            example:
              dictionary: ja
              lang: zh-tw
              queries: [食べました, 学校, 孑々]
              enrich: false
      responses:
        "200":
          description: >-
            One entry or null per submitted query, in the same order and with the same
            length as the input, including duplicate queries. The queries are not repeated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchLookupResponse"
        "400":
          description: Invalid JSON body, invalid shape, or a missing/unsupported dictionary or language.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidJson:
                  value:
                    error: Request body must be valid JSON
                invalidShape:
                  value:
                    error: Request body must include a non-empty queries array
        "401":
          description: Enrichment was requested without the configured bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: >-
            An operational failure for any item fails the whole batch instead of hiding
            the failed item as a null entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    enrichmentBearer:
      type: http
      scheme: bearer
      description: Required only when `enrich=true`.
  schemas:
    IndexResponse:
      type: object
      required: [name, description, health, meta, lookup, batchLookup, docs, openapi, dataRelease]
      properties:
        name:
          type: string
          const: Yori Dict
        description:
          type: string
        health:
          type: string
        meta:
          type: string
        lookup:
          type: string
        batchLookup:
          type: string
        docs:
          type: string
        openapi:
          type: string
        dataRelease:
          type: string
          format: uri
    ApiLang:
      type: string
      enum: [en, de, zh-tw, zh-cn, ko]
    MetaResponse:
      type: object
      required: [apiVersion, dictionaryVersion, languages, tags, sources]
      properties:
        apiVersion:
          type: string
          const: v1
        dictionaryVersion:
          type: [string, "null"]
        languages:
          type: array
          items:
            $ref: "#/components/schemas/ApiLang"
        tags:
          type: object
          description: >-
            Every JMdict tag code used in partOfSpeech, misc, field, and dialect,
            mapped to its description. Empty when the dictionary carries no tag
            metadata.
          additionalProperties:
            type: string
        sources:
          type: array
          items:
            type: object
            required: [name, license, url]
            properties:
              name:
                type: string
              license:
                type: string
              url:
                type: string
    LookupResult:
      anyOf:
        - $ref: "#/components/schemas/LookupEntry"
        - type: "null"
    BatchLookupRequest:
      type: object
      required: [dictionary, lang, queries]
      properties:
        dictionary:
          type: string
          enum: [ja, en]
        queries:
          type: array
          minItems: 1
          items:
            oneOf:
              - type: string
                minLength: 1
              - $ref: "#/components/schemas/EnrichmentCandidate"
        lang:
          $ref: "#/components/schemas/ApiLang"
        enrich:
          type: boolean
          default: false
          description: Resolve missing entries and fill missing examples. Requires bearer authentication.
    EnrichmentCandidate:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
        lemma:
          type: string
        reading:
          type: string
        context:
          type: string
    BatchLookupResponse:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          description: >-
            Same length and order as the submitted queries. Duplicate queries keep
            separate positions and the submitted query strings are not repeated.
          items:
            $ref: "#/components/schemas/LookupResult"
    LookupEntry:
      type: object
      description: >-
        One base entry shape for both dictionaries. Japanese keeps its reading and
        inflection details; English keeps its pronunciations.
      required: [id, dictionary, lang, headword, headwords, meanings, sources]
      properties:
        id:
          type: string
          example: yori:e_jmdict_1358280
        dictionary:
          type: string
          enum: [ja, en]
        lang:
          $ref: "#/components/schemas/ApiLang"
        headword:
          type: string
          example: 食べる
        headwords:
          type: array
          items:
            $ref: "#/components/schemas/Headword"
        meanings:
          type: array
          minItems: 1
          description: >-
            The complete ordered meaning list for the requested explanation language.
            Meanings without content in that language are absent, and an entry with no
            such meaning is returned as null instead.
          items:
            $ref: "#/components/schemas/Meaning"
        sources:
          type: array
          description: Concise source identifiers, such as `jmdict:1358280` or `generated`.
          items:
            type: string
        reading:
          type: [string, "null"]
          description: Japanese only.
          example: たべる
        common:
          type: boolean
          description: Japanese only.
        estimatedLevel:
          type: string
          description: >-
            Japanese only. Unofficial estimated JLPT band, omitted when the pinned source
            lists do not cover the JMdict source ID.
          enum: [N1, N2, N3, N4, N5]
        inflectionPath:
          type: array
          description: Japanese only. Ordered deinflection steps; omitted for exact lookups.
          items:
            $ref: "#/components/schemas/InflectionStep"
        pronunciations:
          type: array
          description: English only.
          items:
            type: object
            required: [ipa]
            properties:
              ipa:
                type: string
              region:
                type: string

    Headword:
      type: object
      required: [text]
      properties:
        text:
          type: string
        reading:
          type: [string, "null"]
          description: Japanese only.
        kind:
          type: string
          description: Japanese only.
          enum: [kanji, kana]
        common:
          type: boolean
          description: Japanese only.
        tags:
          type: array
          description: Japanese only.
          items:
            type: string
    Xref:
      type: array
      description: >-
        Cross-reference to another entry, in one of the JMdict-simplified forms:
        [word], [word, senseIndex], [word, reading], or [word, reading, senseIndex].
      items:
        oneOf:
          - type: string
          - type: integer
      example: [汚い, きたない, 1]
    LanguageSource:
      type: object
      required: [lang, full, wasei, text]
      properties:
        lang:
          type: string
          description: ISO 639-2 code of the source language.
          example: eng
        full:
          type: boolean
          description: Whether the source text fully describes the loanword.
        wasei:
          type: boolean
          description: Whether the word is wasei-eigo (Japanese-made pseudo-loanword).
        text:
          type: [string, "null"]
          example: personal computer
    Meaning:
      type: object
      required: [id, position, partOfSpeech, glosses, examples, sources, provenance]
      description: >-
        One meaning in the requested explanation language. Annotation fields are omitted
        when the dictionary has no values for them. Japanese tag codes in misc, field,
        dialect, and partOfSpeech are described by `tags` on /v1/meta.
      properties:
        id:
          type: string
          example: yori:s_jmdict_1358280_1
        position:
          type: integer
          minimum: 1
        partOfSpeech:
          type: array
          items:
            type: string
          example: [v1, vt]
        glosses:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Gloss"
        examples:
          type: array
          description: Sourced or generated examples, ordered within this meaning. Empty when none exist.
          items:
            $ref: "#/components/schemas/Example"
        sources:
          type: array
          description: Concise source evidence identifiers for this meaning. Empty for meanings with no source evidence.
          items:
            type: string
        provenance:
          type: string
          description: Whether the meaning is source-backed or added from established model knowledge.
          enum: [source, generated]
        appliesTo:
          type: object
          description: Japanese only.
          required: [kanji, kana]
          properties:
            kanji:
              type: array
              items:
                type: string
            kana:
              type: array
              items:
                type: string
        misc:
          type: array
          description: Japanese only. Miscellaneous tags, such as `uk` (usually written in kana) or `col`.
          items:
            type: string
          example: [uk]
        field:
          type: array
          description: Japanese only. Fields of application, such as `comp`, `med`, or `finc`.
          items:
            type: string
          example: [comp]
        dialect:
          type: array
          description: Japanese only. Dialects the meaning belongs to, such as `ksb` (Kansai-ben).
          items:
            type: string
          example: [ksb]
        info:
          type: array
          description: Japanese only. Free-text notes about this meaning.
          items:
            type: string
        related:
          type: array
          description: Japanese only.
          items:
            $ref: "#/components/schemas/Xref"
        antonym:
          type: array
          description: Japanese only.
          items:
            $ref: "#/components/schemas/Xref"
        languageSource:
          type: array
          description: Japanese only. Origin of loanwords and wasei-eigo.
          items:
            $ref: "#/components/schemas/LanguageSource"
        pronunciations:
          type: array
          description: Japanese only. Meaning-specific readings.
          items:
            type: string
        pragmaticFunctions:
          type: array
          description: Japanese only.
          items:
            type: string
        registers:
          type: array
          description: English only.
          items:
            type: string
        regions:
          type: array
          description: English only.
          items:
            type: string
        domains:
          type: array
          description: English only.
          items:
            type: string
        dated:
          type: boolean
          description: English only.
        usage:
          type: array
          description: English only.
          items:
            type: string
    Gloss:
      type: object
      required: [text, source, reviewStatus]
      properties:
        text:
          type: string
          description: Japanese gloss text, or the English definition.
        source:
          type: string
          description: Concise source identifier, such as `jmdict`, `open-english-wordnet`, or `generated`.
        reviewStatus:
          type: string
          enum: [source, checked]
        type:
          type: string
          description: Kind of translation. Omitted when absent.
          enum: [literal, figurative, explanation, trademark]
    InflectionStep:
      type: object
      required: [from, to, reason]
      properties:
        from:
          type: string
          example: 食べました
        to:
          type: string
          example: 食べる
        reason:
          type: string
          example: polite past
    ExampleTranslation:
      type: object
      required: [lang, text]
      properties:
        lang:
          type: string
          description: BCP 47 language code for the translation.
          example: en
        text:
          type: string
          example: You should eat more fruit.
    Example:
      type: object
      required: [text, translations, source, reviewStatus]
      properties:
        text:
          type: string
          description: Example sentence in the headword language.
          example: もっと果物を食べるべきです。
        translations:
          type: array
          description: Paired sentences from the same example. Empty when the example has none.
          items:
            $ref: "#/components/schemas/ExampleTranslation"
        source:
          type: string
          description: Distinguishes imported human examples from generated examples.
          enum: [sourced, generated]
        sourceName:
          type: string
          description: Corpus name for a sourced example. Omitted when not applicable.
          example: Tatoeba
        sourceId:
          type: string
          description: Identifier in the source corpus. Omitted when not applicable.
          example: "193344"
        reviewStatus:
          type: string
          description: Source examples are untouched; generated examples must be checked.
          enum: [source, checked]
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
