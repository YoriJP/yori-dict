openapi: 3.1.0
info:
  title: Yori Dict API
  version: 1.0.0
  description: >-
    Independent Japanese and English dictionary lookup with authenticated on-demand
    enrichment. Every lookup names one dictionary and one explanation language;
    there is no default and no fallback between languages.
  license:
    name: MIT for code; CC BY-SA 4.0 for dictionary data
    url: https://github.com/YoriJP/yori-dict/blob/main/DATA_SOURCES.md
servers:
  - url: https://{host}
    description: Railway deployment
    variables:
      host:
        default: yori-dict-production.up.railway.app
  - url: http://localhost:3000
    description: Local development server
paths:
  /:
    get:
      summary: API index
      operationId: getIndex
      responses:
        "200":
          description: Basic service links and public artifacts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexResponse"
              example:
                name: Yori Dict
                description: Open Japanese and English dictionary lookup backed by independent data releases.
                health: /health
                meta: /v1/meta
                lookup: "/v1/lookup?q=食べました&dictionary=ja&lang=zh-tw"
                batchLookup: /v1/lookup/batch
                docs: /doc
                openapi: /openapi.yaml
                dataRelease: https://github.com/YoriJP/yori-dict/releases/tag/data-2026-08-08
  /doc:
    get:
      summary: API documentation
      operationId: getApiDocs
      responses:
        "200":
          description: Scalar API reference HTML page for this API.
          content:
            text/html:
              schema:
                type: string
  /openapi.yaml:
    get:
      summary: OpenAPI YAML document
      operationId: getOpenApiYaml
      responses:
        "200":
          description: Raw OpenAPI YAML document for this API.
          content:
            application/yaml:
              schema:
                type: string
              example: "openapi: 3.1.0\ninfo:\n  title: Yori Dict API\n"
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: The API is running.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
              example:
                ok: true
  /v1/meta:
    get:
      summary: Dictionary metadata
      operationId: getMeta
      responses:
        "200":
          description: API version, dictionary version, supported languages, and data sources.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaResponse"
              example:
                apiVersion: v1
                dictionaryVersion: "2026-06-01"
                languages: [en, ko, zh-cn, zh-tw]
                dictionaries:
                  ja:
                    languages: [en, ko, zh-cn, zh-tw]
                    accepts: [en, de, zh-tw, zh-cn, ko, ja]
                  en:
                    languages: [en]
                    accepts: [en, ja, zh-tw]
                tags:
                  uk: word usually written using kana alone
                  vt: transitive verb
                  ksb: Kansai-ben
                sources:
                  - name: JMdict
                    license: CC-BY-SA-4.0
                    url: https://www.edrdg.org/wiki/index.php/JMdict-EDICT_Dictionary_Project
                  - name: Tatoeba example sentences
                    license: CC-BY-2.0-FR
                    url: https://tatoeba.org/en/terms_of_use
                  - name: yomitan-jlpt-vocab estimated levels
                    license: CC-BY-SA-4.0
                    url: https://github.com/stephenmk/yomitan-jlpt-vocab
                  - name: Yori generated zh-TW glosses (legacy records)
                    license: CC-BY-SA-4.0
                    url: https://github.com/YoriJP/yori-dict/blob/main/sources/ai-glosses/zh-tw.jsonl
                  - name: Yori generated zh-CN glosses (legacy records)
                    license: CC-BY-SA-4.0
                    url: https://github.com/YoriJP/yori-dict/blob/main/sources/ai-glosses/zh-cn.jsonl
                  - name: Yori generated Korean glosses (legacy records)
                    license: CC-BY-SA-4.0
                    url: https://github.com/YoriJP/yori-dict/blob/main/sources/ai-glosses/ko.jsonl
                  - name: Open English WordNet
                    license: CC-BY-4.0
                    url: https://en-word.net/
                  - name: Simple English Wiktionary
                    license: CC-BY-SA-4.0 AND GFDL-1.1-or-later
                    url: https://simple.wiktionary.org/wiki/Wiktionary:Copyrights
  /v1/lookup:
    get:
      summary: Look up one term in an independent dictionary
      operationId: lookup
      parameters:
        - name: q
          in: query
          required: true
          description: >-
            The word as it appeared in the text. Japanese resolves an inflected
            form by deinflection; English resolves a regular inflected surface to
            its lemma. Either way the response `headword` is the resolved entry's,
            and the queried surface is not echoed back.
          schema:
            type: string
          example: 食べました
        - name: dictionary
          in: query
          required: true
          description: Independent headword dictionary to query. There is no default.
          schema:
            type: string
            enum: [ja, en]
        - name: lang
          in: query
          required: true
          description: >-
            Explanation language of the returned senses. There is no default and no
            fallback. `ja` supports en, de, zh-tw, zh-cn, ko, and ja; `en` supports en,
            ja, and zh-tw. Any other combination is a request error. A supported
            language with no content yet returns null rather than an error; read
            `dictionaries` in `/v1/meta` to discover which pairs have content.
          schema:
            $ref: "#/components/schemas/ApiLang"
          example: zh-tw
        - name: enrich
          in: query
          required: false
          description: >-
            Best-effort completion of missing language groups and sense examples across
            the primary match and its same-tier alternatives. Requires bearer authentication.
          schema:
            type: boolean
            default: false
        - name: lemma
          in: query
          required: false
          description: Consumer-supplied lemma hint used only during authenticated enrichment.
          schema:
            type: string
        - name: reading
          in: query
          required: false
          description: Consumer-supplied Japanese reading hint used only during authenticated enrichment.
          schema:
            type: string
        - name: context
          in: query
          required: false
          description: Sentence containing the candidate, used only for enrichment eligibility and disambiguation.
          schema:
            type: string
      responses:
        "200":
          description: >-
            The entry in the requested explanation language, or null when no acceptable
            content exists for that dictionary and language. A null is also returned when
            enrichment was requested but the provider refused the account; the
            X-Yori-Enrichment header is present in that case and the null must not be
            recorded as a settled dictionary miss.
          headers:
            X-Yori-Enrichment:
              description: >-
                Present only when the model provider refused the account rather than a
                word — a spent budget, an expired key, a rejected request shape. The
                published dictionary answered this request; anything enrichment would
                have authored is missing. `budget` will not clear on its own and needs
                someone to raise the limit, the rest need a config change, and none of
                them are worth retrying on a timer.
              schema:
                type: string
                enum: [authentication, configuration, unsupported-parameter, budget]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LookupResult"
        "400":
          description: Missing query, dictionary, or explanation language, or an unsupported combination.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Missing required query parameter: q"
        "401":
          description: Enrichment was requested without the configured bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: >-
            A database or persistence failure. Operational failures stay errors and never
            become a null entry. A model-provider failure no longer lands here when it is
            about the account: those degrade to a 200 carrying the published entry and the
            X-Yori-Enrichment header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/lookup/batch:
    post:
      summary: Look up multiple terms in an independent dictionary
      operationId: batchLookup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchLookupRequest"
            example:
              dictionary: ja
              lang: zh-tw
              queries: [食べました, 学校, 孑々]
              enrich: false
      responses:
        "200":
          description: >-
            One entry or null per submitted query, in the same order and with the same
            length as the input, including duplicate queries. The queries are not repeated.
            Also returned when the provider refused the account: the published dictionary
            answers every query and an `enrichment` object says why the entries are
            thinner than requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchLookupResponse"
        "400":
          description: Invalid JSON body, invalid shape, or a missing/unsupported dictionary or language.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidJson:
                  value:
                    error: Request body must be valid JSON
                invalidShape:
                  value:
                    error: Request body must include a non-empty queries array
        "401":
          description: Enrichment was requested without the configured bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: >-
            A storage or projection failure, wherever it is raised, and a batch in which
            every query's provider call failed for a reason about that call. A provider
            failure for one query while another survives is not one of these: that query
            is a null entry and the batch returns 200. Nor is a refusal about the account
            — a spent budget, an expired key, a rejected request shape — which degrades to
            a 200 carrying `enrichment` rather than failing the batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    enrichmentBearer:
      type: http
      scheme: bearer
      description: Required only when `enrich=true`.
  schemas:
    IndexResponse:
      type: object
      required: [name, description, health, meta, lookup, batchLookup, docs, openapi, dataRelease]
      properties:
        name:
          type: string
          const: Yori Dict
        description:
          type: string
        health:
          type: string
        meta:
          type: string
        lookup:
          type: string
        batchLookup:
          type: string
        docs:
          type: string
        openapi:
          type: string
        dataRelease:
          type: string
          format: uri
    ApiLang:
      type: string
      enum: [en, de, zh-tw, zh-cn, ko, ja]
    MetaResponse:
      type: object
      required: [apiVersion, dictionaryVersion, languages, tags, sources, dictionaries]
      properties:
        apiVersion:
          type: string
          const: v1
        dictionaryVersion:
          type: [string, "null"]
          description: The Japanese dictionary's release version.
        languages:
          type: array
          description: >-
            The Japanese dictionary's explanation languages, derived from the
            senses that exist rather than declared. Use `dictionaries` to read
            either dictionary's own list.
          items:
            $ref: "#/components/schemas/ApiLang"
        dictionaries:
          type: object
          description: >-
            Every headword dictionary this API serves. The two dictionaries are
            independent and no union of their lists is implied.
          additionalProperties:
            type: object
            required: [languages, accepts]
            properties:
              languages:
                type: array
                description: >-
                  The explanation languages this dictionary currently holds
                  senses in, derived from its own rows. Observed, not declared,
                  so it grows when Enrich-on-Lookup authors a language the
                  released data did not carry. Read it to know what can be
                  served today without a model call.
                items:
                  $ref: "#/components/schemas/ApiLang"
              accepts:
                type: array
                description: >-
                  The explanation languages a lookup will accept for this
                  dictionary. Fixed by the contract and unaffected by coverage.
                  A language here but not in `languages` is a gap
                  Enrich-on-Lookup fills, never a request error. Read this to
                  decide which locales to offer.
                items:
                  $ref: "#/components/schemas/ApiLang"
        tags:
          type: object
          description: >-
            Every JMdict tag code used in partOfSpeech, misc, field, and dialect,
            mapped to its description. Empty when the dictionary carries no tag
            metadata.
          additionalProperties:
            type: string
        sources:
          type: array
          items:
            type: object
            required: [name, license, url]
            properties:
              name:
                type: string
              license:
                type: string
              url:
                type: string
    LookupResult:
      anyOf:
        - $ref: "#/components/schemas/LookupEntry"
        - type: "null"
    LookupAlternatives:
      type: array
      description: >-
        The other entries this query reached, in ranking order, after the one
        that answered it, from that match tier only. Absent when there are
        none, which is most queries. A surface that is itself a word does not
        carry the entries of what it deinflects to.
        One written form can be several unrelated words — こと is both 事 and 琴,
        `best` is three lexemes — and the order is a ranking, not a verdict, so
        a client showing a popup can offer the rest instead of trusting the
        first. A client that wants one answer reads the entry as before and
        ignores this. An alternative never carries its own alternatives.
      items:
        $ref: "#/components/schemas/LookupEntry"
    BatchLookupRequest:
      type: object
      required: [dictionary, lang, queries]
      properties:
        dictionary:
          type: string
          enum: [ja, en]
        queries:
          type: array
          minItems: 1
          items:
            oneOf:
              - type: string
                minLength: 1
              - $ref: "#/components/schemas/EnrichmentCandidate"
        lang:
          $ref: "#/components/schemas/ApiLang"
        enrich:
          type: boolean
          default: false
          description: >-
            Best-effort completion of missing language groups and sense examples across
            the primary match and its same-tier alternatives. Requires bearer authentication.
    EnrichmentCandidate:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
        lemma:
          type: string
        reading:
          type: string
        context:
          type: string
    BatchLookupResponse:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          description: >-
            Same length and order as the submitted queries. Duplicate queries keep
            separate positions and the submitted query strings are not repeated.
            A query whose enrichment failed for a reason about that call is null,
            the same as a miss, so one unavailable word never discards the entries
            beside it; the failure is recorded in the server log. A batch in which
            every query failed that way returns 500 instead, so a total outage
            cannot be mistaken for a dictionary with nothing in it. When the
            refusal is about the account, `enrichment` is present and a null here
            is unsettled rather than a miss — the word may be one enrichment would
            have authored. Only a provider failure is treated either way; a storage
            or projection error still fails the request, wherever it is raised.
          items:
            $ref: "#/components/schemas/LookupResult"
        enrichment:
          type: object
          required: [status, reason, message]
          description: >-
            Present only when the model provider refused the account rather than
            a word — a spent budget, an expired key, a rejected request shape.
            Enrichment is skipped for the rest of the batch and every query is
            answered from the published dictionary instead, so the response is a
            200 carrying thinner entries rather than an error. Callers must treat
            a null in `entries` as unsettled while this is present: the word may
            simply be one enrichment would have authored. Absent on a healthy
            request, so its presence is the whole signal.
          properties:
            status:
              type: string
              enum: [unavailable]
            reason:
              type: string
              enum: [authentication, configuration, unsupported-parameter, budget]
              description: >-
                Why the provider refused. `budget` will not clear on its own and
                needs someone to raise the limit; the rest need a config change.
                None of them are worth retrying on a timer.
            message:
              type: string
    LookupEntry:
      type: object
      description: >-
        One base entry shape for both dictionaries. Japanese keeps its reading and
        inflection details; English keeps its pronunciations.
      required: [id, dictionary, lang, headword, headwords, senses, sources]
      properties:
        id:
          type: string
          example: yori:e_jmdict_1358280
        dictionary:
          type: string
          enum: [ja, en]
        lang:
          $ref: "#/components/schemas/ApiLang"
        headword:
          type: string
          example: 食べる
        headwords:
          type: array
          items:
            $ref: "#/components/schemas/Headword"
        alternatives:
          $ref: "#/components/schemas/LookupAlternatives"
        senses:
          type: array
          minItems: 1
          description: >-
            The complete ordered sense list for the requested explanation language.
            Senses without content in that language are absent, and an entry with no
            such sense is returned as null instead.
          items:
            $ref: "#/components/schemas/Sense"
        sources:
          type: array
          description: Concise source identifiers, such as `jmdict:1358280` or `generated`.
          items:
            type: string
        reading:
          type: [string, "null"]
          description: Japanese only.
          example: たべる
        common:
          type: boolean
          description: Japanese only.
        estimatedLevel:
          type: string
          description: >-
            Japanese only. Unofficial estimated JLPT band, omitted when the pinned source
            lists do not cover the JMdict source ID.
          enum: [N1, N2, N3, N4, N5]
        inflectionPath:
          type: array
          description: Japanese only. Ordered deinflection steps; omitted for exact lookups.
          items:
            $ref: "#/components/schemas/InflectionStep"
        pronunciations:
          type: array
          description: English only.
          items:
            type: object
            required: [ipa]
            properties:
              ipa:
                type: string
              region:
                type: string

    Headword:
      type: object
      required: [text]
      properties:
        text:
          type: string
        reading:
          type: [string, "null"]
          description: Japanese only.
        kind:
          type: string
          description: Japanese only.
          enum: [kanji, kana]
        common:
          type: boolean
          description: Japanese only.
        tags:
          type: array
          description: Japanese only.
          items:
            type: string
    Xref:
      type: array
      description: >-
        Cross-reference to another entry, in one of the JMdict-simplified forms:
        [word], [word, senseIndex], [word, reading], or [word, reading, senseIndex].
      items:
        oneOf:
          - type: string
          - type: integer
      example: [汚い, きたない, 1]
    LanguageSource:
      type: object
      required: [lang, full, wasei, text]
      properties:
        lang:
          type: string
          description: ISO 639-2 code of the source language.
          example: eng
        full:
          type: boolean
          description: Whether the source text fully describes the loanword.
        wasei:
          type: boolean
          description: Whether the word is wasei-eigo (Japanese-made pseudo-loanword).
        text:
          type: [string, "null"]
          example: personal computer
    Sense:
      type: object
      required: [id, position, partOfSpeech, glosses, examples, sources, provenance]
      description: >-
        One sense in the requested explanation language. Annotation fields are omitted
        when the dictionary has no values for them. Japanese tag codes in misc, field,
        dialect, and partOfSpeech are described by `tags` on /v1/meta.
      properties:
        id:
          type: string
          example: yori:s_jmdict_1358280_1
        position:
          type: integer
          minimum: 1
        partOfSpeech:
          type: array
          items:
            type: string
          example: [v1, vt]
        glosses:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Gloss"
        examples:
          type: array
          description: Sourced or generated examples, ordered within this sense. Empty when none exist.
          items:
            $ref: "#/components/schemas/Example"
        sources:
          type: array
          description: Concise source evidence identifiers for this sense. Empty for senses with no source evidence.
          items:
            type: string
        provenance:
          type: string
          description: Whether the sense is source-backed or added from established model knowledge.
          enum: [source, generated]
        appliesTo:
          type: object
          description: Japanese only.
          required: [kanji, kana]
          properties:
            kanji:
              type: array
              items:
                type: string
            kana:
              type: array
              items:
                type: string
        misc:
          type: array
          description: Japanese only. Miscellaneous tags, such as `uk` (usually written in kana) or `col`.
          items:
            type: string
          example: [uk]
        field:
          type: array
          description: Japanese only. Fields of application, such as `comp`, `med`, or `finc`.
          items:
            type: string
          example: [comp]
        dialect:
          type: array
          description: Japanese only. Dialects the sense belongs to, such as `ksb` (Kansai-ben).
          items:
            type: string
          example: [ksb]
        info:
          type: array
          description: Japanese only. Free-text notes about this sense.
          items:
            type: string
        related:
          type: array
          description: Japanese only.
          items:
            $ref: "#/components/schemas/Xref"
        antonym:
          type: array
          description: Japanese only.
          items:
            $ref: "#/components/schemas/Xref"
        languageSource:
          type: array
          description: Japanese only. Origin of loanwords and wasei-eigo.
          items:
            $ref: "#/components/schemas/LanguageSource"
        pronunciations:
          type: array
          description: Japanese only. Sense-specific readings.
          items:
            type: string
        pragmaticFunctions:
          type: array
          description: Japanese only.
          items:
            type: string
        registers:
          type: array
          description: English only.
          items:
            type: string
        regions:
          type: array
          description: English only.
          items:
            type: string
        domains:
          type: array
          description: English only.
          items:
            type: string
        dated:
          type: boolean
          description: English only.
        usage:
          type: array
          description: English only.
          items:
            type: string
    Gloss:
      type: object
      required: [text, source, reviewStatus]
      properties:
        text:
          type: string
          description: Japanese gloss text, or the English definition.
        source:
          type: string
          description: Concise source identifier, such as `jmdict`, `open-english-wordnet`, or `generated`.
        reviewStatus:
          type: string
          enum: [source, checked]
        type:
          type: string
          description: Kind of translation. Omitted when absent.
          enum: [literal, figurative, explanation, trademark]
    InflectionStep:
      type: object
      required: [from, to, reason]
      properties:
        from:
          type: string
          example: 食べました
        to:
          type: string
          example: 食べる
        reason:
          type: string
          example: polite past
    ExampleTranslation:
      type: object
      required: [lang, text]
      properties:
        lang:
          type: string
          description: BCP 47 language code for the translation.
          example: en
        text:
          type: string
          example: You should eat more fruit.
    Example:
      type: object
      required: [text, translations, source, reviewStatus]
      properties:
        text:
          type: string
          description: Example sentence in the headword language.
          example: もっと果物を食べるべきです。
        translations:
          type: array
          description: >-
            Paired sentences from the same example. A Japanese Explanation Group uses
            an empty list because its Monolingual Sense Example needs no Japanese
            self-translation; bilingual groups require their requested language.
          items:
            $ref: "#/components/schemas/ExampleTranslation"
        source:
          type: string
          description: Distinguishes imported human examples from generated examples.
          enum: [sourced, generated]
        sourceName:
          type: string
          description: Corpus name for a sourced example. Omitted when not applicable.
          example: Tatoeba
        sourceId:
          type: string
          description: Identifier in the source corpus. Omitted when not applicable.
          example: "193344"
        reviewStatus:
          type: string
          description: Source examples are untouched; generated examples must be checked.
          enum: [source, checked]
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
