openapi: 3.1.0
info:
  title: Yori Dict API
  version: 1.0.0
  description: Japanese dictionary lookup API built from JMdict-simplified with multilingual lookup support.
  license:
    name: MIT for code; CC BY-SA 4.0 for dictionary data
    url: https://github.com/anilahsu/yori-dict/blob/main/DATA_SOURCES.md
servers:
  - url: https://{host}
    description: Railway deployment
    variables:
      host:
        default: yori-dict-production.up.railway.app
  - url: http://localhost:3000
    description: Local development server
paths:
  /:
    get:
      summary: API index
      operationId: getIndex
      responses:
        "200":
          description: Basic service links and public artifacts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexResponse"
              example:
                name: Yori Dict
                description: Open Japanese dictionary API and SQLite database with multilingual lookup support.
                health: /health
                meta: /v1/meta
                lookup: "/v1/lookup?q=食べました&lang=zh-tw"
                batchLookup: /v1/lookup/batch
                docs: /doc
                openapi: /openapi.yaml
                dataRelease: https://github.com/anilahsu/yori-dict/releases/tag/data-2026-07-01
  /doc:
    get:
      summary: API documentation
      operationId: getApiDocs
      responses:
        "200":
          description: Scalar API reference HTML page for this API.
          content:
            text/html:
              schema:
                type: string
  /openapi.yaml:
    get:
      summary: OpenAPI YAML document
      operationId: getOpenApiYaml
      responses:
        "200":
          description: Raw OpenAPI YAML document for this API.
          content:
            application/yaml:
              schema:
                type: string
              example: "openapi: 3.1.0\ninfo:\n  title: Yori Dict API\n"
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: The API is running.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
              example:
                ok: true
  /v1/meta:
    get:
      summary: Dictionary metadata
      operationId: getMeta
      responses:
        "200":
          description: API version, dictionary version, supported languages, and data sources.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaResponse"
              example:
                apiVersion: v1
                dictionaryVersion: "2026-06-01"
                languages: [en, de, zh-tw, zh-cn, ko]
                sources:
                  - name: JMdict
                    license: CC-BY-SA-4.0
                    url: https://www.edrdg.org/wiki/index.php/JMdict-EDICT_Dictionary_Project
                  - name: Yori AI-assisted zh-TW glosses
                    license: CC-BY-SA-4.0
                    url: sources/ai-glosses/zh-tw.jsonl
                  - name: Yori AI-assisted zh-CN glosses
                    license: CC-BY-SA-4.0
                    url: sources/ai-glosses/zh-cn.jsonl
                  - name: Yori AI-assisted Korean glosses
                    license: CC-BY-SA-4.0
                    url: sources/ai-glosses/ko.jsonl
  /v1/lookup:
    get:
      summary: Look up one Japanese term
      operationId: lookup
      parameters:
        - name: q
          in: query
          required: true
          description: Japanese word, reading, or inflected form.
          schema:
            type: string
          example: 食べました
        - name: lang
          in: query
          required: false
          description: Gloss language. Defaults to English.
          schema:
            $ref: "#/components/schemas/ApiLang"
          example: zh-tw
      responses:
        "200":
          description: Best lookup result, or null if no entry matches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LookupResponse"
        "400":
          description: Missing query parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Missing required query parameter: q"
  /v1/lookup/batch:
    post:
      summary: Look up multiple Japanese terms
      operationId: batchLookup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchLookupRequest"
            example:
              queries: [食べました, 学校, 孑々]
              lang: zh-tw
      responses:
        "200":
          description: Lookup results in the same order as the input queries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchLookupResponse"
        "400":
          description: Invalid JSON body, invalid shape, or more than 100 queries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidJson:
                  value:
                    error: Request body must be valid JSON
                invalidShape:
                  value:
                    error: "Request body must be { queries: string[], lang?: string }"
                tooLarge:
                  value:
                    error: Batch size must be 100 or less
components:
  schemas:
    IndexResponse:
      type: object
      required: [name, description, health, meta, lookup, batchLookup, docs, openapi, dataRelease]
      properties:
        name:
          type: string
          const: Yori Dict
        description:
          type: string
        health:
          type: string
        meta:
          type: string
        lookup:
          type: string
        batchLookup:
          type: string
        docs:
          type: string
        openapi:
          type: string
        dataRelease:
          type: string
          format: uri
    ApiLang:
      type: string
      enum: [en, de, zh-tw, zh-cn, ko]
    MetaResponse:
      type: object
      required: [apiVersion, dictionaryVersion, languages, sources]
      properties:
        apiVersion:
          type: string
          const: v1
        dictionaryVersion:
          type: [string, "null"]
        languages:
          type: array
          items:
            $ref: "#/components/schemas/ApiLang"
        sources:
          type: array
          items:
            type: object
            required: [name, license, url]
            properties:
              name:
                type: string
              license:
                type: string
              url:
                type: string
    LookupResponse:
      type: object
      required: [item]
      properties:
        item:
          anyOf:
            - $ref: "#/components/schemas/LookupItem"
            - type: "null"
    BatchLookupRequest:
      type: object
      required: [queries]
      properties:
        queries:
          type: array
          maxItems: 100
          items:
            type: string
        lang:
          $ref: "#/components/schemas/ApiLang"
    BatchLookupResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [input, item]
            properties:
              input:
                type: string
              item:
                anyOf:
                  - $ref: "#/components/schemas/LookupItem"
                  - type: "null"
    LookupItem:
      type: object
      required: [id, word, reading, common, source, sourceId, headwords, senses]
      properties:
        id:
          type: string
          example: yori:e_jmdict_1358280
        word:
          type: string
          example: 食べる
        reading:
          type: [string, "null"]
          example: たべる
        common:
          type: boolean
        source:
          type: string
          const: jmdict
        sourceId:
          type: string
          example: "1358280"
        headwords:
          type: array
          items:
            $ref: "#/components/schemas/Headword"
        senses:
          type: array
          description: Senses without glosses in the requested language are omitted.
          items:
            $ref: "#/components/schemas/Sense"
    Headword:
      type: object
      required: [text, reading, kind, common, tags]
      properties:
        text:
          type: string
        reading:
          type: [string, "null"]
        kind:
          type: string
          enum: [kanji, kana]
        common:
          type: boolean
        tags:
          type: array
          items:
            type: string
    Sense:
      type: object
      required: [id, position, appliesTo, partOfSpeech, glosses]
      properties:
        id:
          type: string
          example: yori:s_jmdict_1358280_1
        position:
          type: integer
          minimum: 1
        appliesTo:
          type: object
          required: [kanji, kana]
          properties:
            kanji:
              type: array
              items:
                type: string
            kana:
              type: array
              items:
                type: string
        partOfSpeech:
          type: array
          items:
            type: string
          example: [v1, vt]
        glosses:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Gloss"
    Gloss:
      type: object
      required: [text, source, reviewStatus]
      properties:
        text:
          type: string
        source:
          type: string
          enum: [jmdict, ai-assisted]
        reviewStatus:
          type: string
          enum: [source, checked]
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
