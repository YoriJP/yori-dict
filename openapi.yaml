openapi: 3.1.0
info:
  title: Yori Dict API
  version: 2.0.0
  description: Canonical multilingual Japanese dictionary API.
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /v2/lookup:
    get:
      summary: Look up one dictionary token
      parameters:
        - name: query
          in: query
          schema:
            type: string
          description: Generic lookup text. Alias of the legacy `word` parameter.
        - name: word
          in: query
          schema:
            type: string
          description: Compatibility alias for `query`.
        - name: surface
          in: query
          schema:
            type: string
          description: Token surface from a tokenizer.
        - name: lemma
          in: query
          schema:
            type: string
          description: Dictionary/base form from a tokenizer.
        - name: reading
          in: query
          schema:
            type: string
          description: Kana or katakana reading from a tokenizer.
        - name: lang
          in: query
          schema:
            $ref: '#/components/schemas/TargetLanguage'
          description: Target gloss language. Defaults to `en`.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
      responses:
        '200':
          description: Lookup result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupResult'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v2/lookup/batch:
    post:
      summary: Look up tokenizer tokens in batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tokens]
              properties:
                lang:
                  $ref: '#/components/schemas/TargetLanguage'
                limit:
                  type: integer
                  minimum: 1
                  maximum: 20
                tokens:
                  type: array
                  maxItems: 100
                  items:
                    $ref: '#/components/schemas/LookupToken'
            examples:
              kuromoji:
                value:
                  lang: en
                  tokens:
                    - surface: 食べました
                      lemma: 食べる
                      reading: タベマシタ
                      pos: 動詞
                    - surface: スシ
      responses:
        '200':
          description: Batch lookup result
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/LookupResult'
                        - type: object
                          required: [token]
                          properties:
                            token:
                              $ref: '#/components/schemas/LookupToken'
        '400':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v2/entries/{id}:
    get:
      summary: Get a canonical entry by Yori ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^yde_[0-9]{8}$'
        - name: lang
          in: query
          schema:
            $ref: '#/components/schemas/TargetLanguage'
          description: Optional language filter for glosses and examples.
      responses:
        '200':
          description: Canonical entry detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryDetail'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v2/kanji/{literal}:
    get:
      summary: Get kanji details by literal
      parameters:
        - name: literal
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 1
        - name: lang
          in: query
          schema:
            $ref: '#/components/schemas/TargetLanguage'
          description: Optional language filter for meanings.
      responses:
        '200':
          description: Canonical kanji detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KanjiDetail'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
components:
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    TargetLanguage:
      type: string
      enum: [en, de, ko, zh-cn, zh-tw]
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    LookupToken:
      type: object
      properties:
        query:
          type: string
        word:
          type: string
        surface:
          type: string
        lemma:
          type: string
        reading:
          type: string
        pos:
          type: string
    MatchedAlias:
      type: object
      required: [aliasId, surface, entryId, matchType, score]
      properties:
        aliasId:
          type: string
        surface:
          type: string
        reading:
          type: string
        entryId:
          type: string
        formId:
          type: string
        readingId:
          type: string
        matchType:
          type: string
        score:
          type: number
    LookupEntry:
      type: object
      required: [id, word, reading, pos, definitions]
      properties:
        id:
          type: string
        word:
          type: string
        reading:
          type: string
        pos:
          type: array
          items:
            type: string
        definitions:
          type: array
          items:
            type: string
    LookupResult:
      type: object
      required: [matched, entries]
      properties:
        matched:
          oneOf:
            - $ref: '#/components/schemas/MatchedAlias'
            - type: 'null'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LookupEntry'
    SourceRef:
      type: object
      required: [kind, importedAt]
      properties:
        kind:
          type: string
          enum: [jmdict, jmnedict, kanjidic2, wiktionary, tatoeba, manual, ai]
        sourceId:
          type: string
        license:
          type: string
        importedAt:
          type: string
        model:
          type: string
        promptVersion:
          type: string
        inputRefs:
          type: array
          items:
            type: string
        reviewStatus:
          type: string
          enum: [unreviewed, approved, rejected]
    Form:
      type: object
      required: [id, text, normalizedText, script, isPrimary, tags, sourceRefs]
      properties:
        id:
          type: string
        text:
          type: string
        normalizedText:
          type: string
        script:
          type: string
        isPrimary:
          type: boolean
        tags:
          type: array
          items:
            type: string
        sourceRefs:
          type: array
          items:
            $ref: '#/components/schemas/SourceRef'
    Reading:
      type: object
      required: [id, text, normalizedText, system, isPrimary, appliesToFormIds, tags, sourceRefs]
      properties:
        id:
          type: string
        text:
          type: string
        normalizedText:
          type: string
        system:
          type: string
        isPrimary:
          type: boolean
        appliesToFormIds:
          oneOf:
            - type: string
              enum: [all]
            - type: array
              items:
                type: string
        tags:
          type: array
          items:
            type: string
        sourceRefs:
          type: array
          items:
            $ref: '#/components/schemas/SourceRef'
    Gloss:
      type: object
      required: [id, lang, text, sourceType, reviewStatus, sourceRefs]
      properties:
        id:
          type: string
        lang:
          $ref: '#/components/schemas/TargetLanguage'
        text:
          type: string
        sourceType:
          type: string
          enum: [source, manual, ai]
        reviewStatus:
          type: string
          enum: [unreviewed, approved, rejected]
        sourceRefs:
          type: array
          items:
            $ref: '#/components/schemas/SourceRef'
    Example:
      type: object
      required: [id, lang, japanese, translation, sourceRefs]
      properties:
        id:
          type: string
        senseId:
          type: string
        lang:
          $ref: '#/components/schemas/TargetLanguage'
        japanese:
          type: string
        translation:
          type: string
        sourceRefs:
          type: array
          items:
            $ref: '#/components/schemas/SourceRef'
    Sense:
      type: object
      required: [id, order, partOfSpeech, appliesToFormIds, appliesToReadingIds, domain, register, misc, glosses, examples, sourceRefs]
      properties:
        id:
          type: string
        order:
          type: integer
        partOfSpeech:
          type: array
          items:
            type: string
        appliesToFormIds:
          oneOf:
            - type: string
              enum: [all]
            - type: array
              items:
                type: string
        appliesToReadingIds:
          oneOf:
            - type: string
              enum: [all]
            - type: array
              items:
                type: string
        domain:
          type: array
          items:
            type: string
        register:
          type: array
          items:
            type: string
        misc:
          type: array
          items:
            type: string
        glosses:
          type: array
          items:
            $ref: '#/components/schemas/Gloss'
        examples:
          type: array
          items:
            $ref: '#/components/schemas/Example'
        sourceRefs:
          type: array
          items:
            $ref: '#/components/schemas/SourceRef'
    EntryDetail:
      type: object
      required: [id, language, entryType, primaryForm, primaryReading, forms, readings, senses, ranking, sourceRefs]
      properties:
        id:
          type: string
        language:
          type: string
        entryType:
          type: string
        primaryForm:
          type: string
        primaryReading:
          type: string
        forms:
          type: array
          items:
            $ref: '#/components/schemas/Form'
        readings:
          type: array
          items:
            $ref: '#/components/schemas/Reading'
        senses:
          type: array
          items:
            $ref: '#/components/schemas/Sense'
        ranking:
          type: object
        sourceRefs:
          type: array
          items:
            $ref: '#/components/schemas/SourceRef'
    KanjiDetail:
      type: object
      required: [id, literal, meanings, readings, stats, sourceRefs]
      properties:
        id:
          type: string
        literal:
          type: string
        meanings:
          type: array
          items:
            type: object
            required: [lang, text, sourceRefs]
            properties:
              lang:
                $ref: '#/components/schemas/TargetLanguage'
              text:
                type: string
              sourceRefs:
                type: array
                items:
                  $ref: '#/components/schemas/SourceRef'
        readings:
          type: array
          items:
            type: object
            required: [type, text, sourceRefs]
            properties:
              type:
                type: string
              text:
                type: string
              sourceRefs:
                type: array
                items:
                  $ref: '#/components/schemas/SourceRef'
        stats:
          type: object
        sourceRefs:
          type: array
          items:
            $ref: '#/components/schemas/SourceRef'
