openapi: 3.0.3
info:
  title: Yori Dict API
  version: 1.0.0
  description: |
    Fast multilingual Japanese dictionary API with automatic conjugations.
    Supports lookup by kanji or reading with per-language translations.

    **Deduplication:** `definitions` are deduplicated across sources (JMdict, Kaikki, Wiktionary, Wadoku).
    `examples` are deduplicated by `(japanese, translation)` pair.

    This spec also documents the internal `/admin/api/*` control plane used by the Admin UI.
    Admin endpoints require `ADMIN_TOKEN` authentication and are intended for internal operations.
  license:
    name: CC-BY-SA-4.0
servers:
  - url: https://yori-dict-production.up.railway.app
    description: Production
  - url: http://localhost:3000
    description: Local development
tags:
  - name: Health
  - name: Dictionary
  - name: Docs
  - name: Admin
paths:
  /openapi.yaml:
    get:
      tags:
        - Docs
      summary: OpenAPI specification
      operationId: getOpenApiSpec
      responses:
        '200':
          description: OpenAPI 3.0 YAML document
          content:
            text/plain:
              schema:
                type: string
  /docs:
    get:
      tags:
        - Docs
      summary: Interactive API reference (Scalar UI)
      operationId: getApiDocs
      responses:
        '200':
          description: HTML page with Scalar API reference UI
          content:
            text/html:
              schema:
                type: string
  /health:
    get:
      tags:
        - Health
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
  /v1/lookup:
    get:
      tags:
        - Dictionary
      summary: Lookup a Japanese word
      description: |
        Looks up a Japanese word by exact match on kanji (`word`) or reading.
        Returns `404` when the word does not exist, or when no translation is available for the requested language.
      operationId: lookupWord
      parameters:
        - name: word
          in: query
          required: true
          description: Japanese word in kanji, hiragana, or katakana.
          schema:
            type: string
            minLength: 1
          example: 食べる
        - name: lang
          in: query
          required: false
          description: |
            Translation language code. Default is `en`.
            Canonical values: `en`, `de`, `ko`, `zh-cn`, `zh-tw`.
            Accepted aliases (case-insensitive): `zh-CN`, `zh-TW`, `zh_cn`, `zh_tw`, `zh-hans`, `zh-hant`.
          schema:
            type: string
            default: en
            enum:
              - en
              - de
              - ko
              - zh-cn
              - zh-tw
              - zh-CN
              - zh-TW
              - zh_cn
              - zh_tw
              - zh-hans
              - zh-hant
          example: en
      responses:
        '200':
          description: Lookup result
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/LookupResponse'
              examples:
                verbWithConjugations:
                  summary: Verb response (conjugations included)
                  value:
                    word: 食べる
                    reading: たべる
                    romaji: taberu
                    partOfSpeech:
                      - ichidan verb
                      - transitive verb
                    definitions:
                      - to eat
                      - to live on (e.g. a salary)
                    frequency: 195
                    conjugations:
                      dictionary: 食べる
                      polite: たべます
                      negative: たべない
                      past: たべた
                      te: たべて
                    examples:
                      - japanese: 毎朝食べます
                        translation: I eat every morning
                nounWithoutConjugations:
                  summary: Non-conjugatable word
                  value:
                    word: 猫
                    reading: ねこ
                    romaji: neko
                    partOfSpeech:
                      - noun
                    definitions:
                      - cat
                    examples: []
        '400':
          description: Invalid request (missing word or invalid language)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingWord:
                  value:
                    error: 'Missing required parameter: word'
                invalidLanguage:
                  value:
                    error: 'Invalid language. Supported: en, de, ko, zh-cn, zh-tw'
        '404':
          description: Word not found or language translation unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Word not found
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Internal server error
  /admin/api/summary:
    get:
      tags:
        - Admin
      summary: Admin dashboard summary
      description: Returns release, review, update, and batch summary data for the admin dashboard.
      operationId: getAdminSummary
      security:
        - basicAuth: []
        - bearerAuth: []
        - adminTokenHeader: []
      responses:
        '200':
          description: Admin summary payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSummaryResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedAdmin'
        '503':
          $ref: '#/components/responses/AdminDisabled'
  /admin/api/releases:
    get:
      tags:
        - Admin
      summary: List releases
      description: Returns release inventory and identifies the active release.
      operationId: getAdminReleaseList
      security:
        - basicAuth: []
        - bearerAuth: []
        - adminTokenHeader: []
      responses:
        '200':
          description: Release inventory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminReleaseListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedAdmin'
        '503':
          $ref: '#/components/responses/AdminDisabled'
  /admin/api/releases/{version}:
    get:
      tags:
        - Admin
      summary: Get one release
      operationId: getAdminRelease
      security:
        - basicAuth: []
        - bearerAuth: []
        - adminTokenHeader: []
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One release record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseListItem'
        '401':
          $ref: '#/components/responses/UnauthorizedAdmin'
        '404':
          description: Release not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/AdminDisabled'
  /admin/api/releases/build:
    post:
      tags:
        - Admin
      summary: Build a release from snapshot data
      operationId: buildAdminRelease
      security:
        - basicAuth: []
        - bearerAuth: []
        - adminTokenHeader: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReleaseBuildRequest'
      responses:
        '200':
          description: Release build result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseActionResult'
        '401':
          $ref: '#/components/responses/UnauthorizedAdmin'
        '503':
          $ref: '#/components/responses/AdminDisabled'
  /admin/api/new-word:
    post:
      tags:
        - Admin
      summary: Create a new word in snapshot data
      description: |
        Writes a new canonical entry into snapshot JSON. The new word is not visible to runtime lookup
        until a new release is built and activated.
      operationId: createAdminNewWord
      security:
        - basicAuth: []
        - bearerAuth: []
        - adminTokenHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminNewWordFormData'
      responses:
        '200':
          description: Word created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNewWordResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNewWordResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedAdmin'
        '409':
          description: Duplicate or conflicting word
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNewWordResponse'
        '503':
          $ref: '#/components/responses/AdminDisabled'
  /admin/api/new-word/build-release:
    post:
      tags:
        - Admin
      summary: Build a release after creating a new word
      operationId: buildAdminReleaseForNewWord
      security:
        - basicAuth: []
        - bearerAuth: []
        - adminTokenHeader: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminNewWordBuildReleaseRequest'
      responses:
        '200':
          description: Release build result for the newly created word
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNewWordBuildReleaseResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedAdmin'
        '503':
          $ref: '#/components/responses/AdminDisabled'
  /admin/api/releases/{version}/activate:
    post:
      tags:
        - Admin
      summary: Activate an existing release
      operationId: activateAdminRelease
      security:
        - basicAuth: []
        - bearerAuth: []
        - adminTokenHeader: []
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Release activation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseActionResult'
        '401':
          $ref: '#/components/responses/UnauthorizedAdmin'
        '503':
          $ref: '#/components/responses/AdminDisabled'
  /admin/api/releases/promote:
    post:
      tags:
        - Admin
      summary: Promote effective updates into a new release
      operationId: promoteAdminRelease
      security:
        - basicAuth: []
        - bearerAuth: []
        - adminTokenHeader: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReleasePromoteRequest'
      responses:
        '200':
          description: Release promotion result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseActionResult'
        '401':
          $ref: '#/components/responses/UnauthorizedAdmin'
        '503':
          $ref: '#/components/responses/AdminDisabled'
  /admin/api/entries:
    get:
      tags:
        - Admin
      summary: Inspect an entry across release and update layers
      operationId: inspectAdminEntry
      security:
        - basicAuth: []
        - bearerAuth: []
        - adminTokenHeader: []
      parameters:
        - name: word
          in: query
          required: true
          schema:
            type: string
        - name: lang
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/LanguageCode'
      responses:
        '200':
          description: Entry inspection payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEntryInspectionResponse'
        '400':
          description: Missing word
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedAdmin'
        '503':
          $ref: '#/components/responses/AdminDisabled'
  /admin/api/updates:
    get:
      tags:
        - Admin
      summary: List updates across source and AI layers
      operationId: listAdminUpdates
      security:
        - basicAuth: []
        - bearerAuth: []
        - adminTokenHeader: []
      parameters:
        - name: lang
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/LanguageCode'
        - name: sourceType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UpdateSourceType'
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: reviewStatus
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ReviewStatus'
      responses:
        '200':
          description: Update explorer payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUpdatesResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedAdmin'
        '503':
          $ref: '#/components/responses/AdminDisabled'
  /admin/api/review/ai:
    get:
      tags:
        - Admin
      summary: Get pending AI review queue
      operationId: getAdminAiReviewQueue
      security:
        - basicAuth: []
        - bearerAuth: []
        - adminTokenHeader: []
      parameters:
        - name: lang
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/LanguageCode'
      responses:
        '200':
          description: Pending AI translations and example sets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminReviewQueueResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedAdmin'
        '503':
          $ref: '#/components/responses/AdminDisabled'
  /admin/api/review/translation/{id}/approve:
    post:
      tags:
        - Admin
      summary: Approve one AI translation update
      operationId: approveAdminTranslationReview
      security:
        - basicAuth: []
        - bearerAuth: []
        - adminTokenHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReviewActionRequest'
      responses:
        '200':
          description: Updated translation review state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedTranslationUpdate'
        '401':
          $ref: '#/components/responses/UnauthorizedAdmin'
        '404':
          description: Translation update not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/AdminDisabled'
  /admin/api/review/translation/{id}/reject:
    post:
      tags:
        - Admin
      summary: Reject one AI translation update
      operationId: rejectAdminTranslationReview
      security:
        - basicAuth: []
        - bearerAuth: []
        - adminTokenHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReviewActionRequest'
      responses:
        '200':
          description: Updated translation review state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedTranslationUpdate'
        '401':
          $ref: '#/components/responses/UnauthorizedAdmin'
        '404':
          description: Translation update not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/AdminDisabled'
  /admin/api/review/example-set/{id}/approve:
    post:
      tags:
        - Admin
      summary: Approve one AI example set
      operationId: approveAdminExampleSetReview
      security:
        - basicAuth: []
        - bearerAuth: []
        - adminTokenHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReviewActionRequest'
      responses:
        '200':
          description: Updated example set review state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedExampleUpdateSet'
        '401':
          $ref: '#/components/responses/UnauthorizedAdmin'
        '404':
          description: Example update set not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/AdminDisabled'
  /admin/api/review/example-set/{id}/reject:
    post:
      tags:
        - Admin
      summary: Reject one AI example set
      operationId: rejectAdminExampleSetReview
      security:
        - basicAuth: []
        - bearerAuth: []
        - adminTokenHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReviewActionRequest'
      responses:
        '200':
          description: Updated example set review state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedExampleUpdateSet'
        '401':
          $ref: '#/components/responses/UnauthorizedAdmin'
        '404':
          description: Example update set not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/AdminDisabled'
  /admin/api/jobs/source-update:
    post:
      tags:
        - Admin
      summary: Run deterministic source update
      operationId: runAdminSourceUpdate
      security:
        - basicAuth: []
        - bearerAuth: []
        - adminTokenHeader: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSourceUpdateJobRequest'
      responses:
        '200':
          description: Source update job result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSourceUpdateJobResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedAdmin'
        '503':
          $ref: '#/components/responses/AdminDisabled'
  /admin/api/jobs/gemini-import:
    post:
      tags:
        - Admin
      summary: Run Gemini import
      operationId: runAdminGeminiImport
      security:
        - basicAuth: []
        - bearerAuth: []
        - adminTokenHeader: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminGeminiImportRequest'
      responses:
        '200':
          description: Gemini import result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminGeminiImportResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedAdmin'
        '503':
          $ref: '#/components/responses/AdminDisabled'
  /admin/api/batches/{id}:
    get:
      tags:
        - Admin
      summary: Get one batch detail
      operationId: getAdminBatchDetail
      security:
        - basicAuth: []
        - bearerAuth: []
        - adminTokenHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Batch detail payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBatchDetailResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedAdmin'
        '503':
          $ref: '#/components/responses/AdminDisabled'
components:
  responses:
    UnauthorizedAdmin:
      description: Admin authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Unauthorized
    AdminDisabled:
      description: Admin UI is disabled because no admin token is configured
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Admin UI is disabled. Set ADMIN_TOKEN to enable /admin routes.
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
    adminTokenHeader:
      type: apiKey
      in: header
      name: x-admin-token
  schemas:
    LanguageCode:
      type: string
      enum:
        - en
        - de
        - ko
        - zh-cn
        - zh-tw
    UpdateSourceType:
      type: string
      enum:
        - source
        - ai
    ReviewStatus:
      type: string
      enum:
        - not_required
        - pending
        - approved
        - rejected
    UpdateStatus:
      type: string
      enum:
        - active
        - superseded
        - promoted
    UpdateBatchStatus:
      type: string
      enum:
        - running
        - succeeded
        - failed
    SeedLanguage:
      type: string
      enum:
        - en
        - de
        - ko
        - zh-cn
        - zh-tw
        - none
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    LookupResponse:
      type: object
      required:
        - word
        - reading
        - romaji
        - partOfSpeech
        - definitions
        - examples
      properties:
        word:
          type: string
          description: Kanji form
        reading:
          type: string
          description: Hiragana reading
        romaji:
          type: string
          description: Romanized reading
        partOfSpeech:
          type: array
          items:
            type: string
        definitions:
          type: array
          items:
            type: string
        frequency:
          type: integer
          description: >
            Frequency rank from JPDB (1 = most common). Only present if
            frequency data is available for this entry.
        conjugations:
          $ref: '#/components/schemas/Conjugations'
        examples:
          type: array
          description: Example sentences for this word in the requested language. Always present (may be empty).
          items:
            $ref: '#/components/schemas/ExampleSentence'
    Conjugations:
      type: object
      required:
        - dictionary
        - polite
        - negative
        - past
        - te
      properties:
        dictionary:
          type: string
        polite:
          type: string
        negative:
          type: string
        past:
          type: string
        te:
          type: string
    ExampleSentence:
      type: object
      required:
        - japanese
        - translation
      properties:
        japanese:
          type: string
        translation:
          type: string
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    ReleaseActionResult:
      type: object
      required:
        - version
        - dbPath
        - manifestPath
        - activated
      properties:
        version:
          type: string
        dbPath:
          type: string
        manifestPath:
          type: string
        activated:
          type: boolean
    ReleaseListItem:
      type: object
      required:
        - version
        - dbPath
        - manifestPath
        - builtAt
        - schemaVersion
        - baseSourceFingerprint
        - promotedFromUpdateSequence
        - isActive
      properties:
        version:
          type: string
        dbPath:
          type: string
        manifestPath:
          type: string
        builtAt:
          type: string
          format: date-time
        schemaVersion:
          type: string
        baseSourceFingerprint:
          type: string
        promotedFromUpdateSequence:
          type: integer
          nullable: true
        isActive:
          type: boolean
    UpdateBatchRecord:
      type: object
      required:
        - id
        - kind
        - createdAt
        - inputManifest
        - notes
        - status
        - completedAt
        - errorMessage
        - actor
      properties:
        id:
          type: integer
        kind:
          type: string
          enum:
            - source_import
            - ai_import
        createdAt:
          type: string
          format: date-time
        inputManifest:
          type: object
          additionalProperties: true
        notes:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/UpdateBatchStatus'
        completedAt:
          type: string
          format: date-time
          nullable: true
        errorMessage:
          type: string
          nullable: true
        actor:
          type: string
          nullable: true
    ReviewMetadata:
      type: object
      required:
        - reviewStatus
        - reviewedAt
        - reviewedBy
        - reviewNotes
      properties:
        reviewStatus:
          $ref: '#/components/schemas/ReviewStatus'
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        reviewedBy:
          type: string
          nullable: true
        reviewNotes:
          type: string
          nullable: true
    ReleaseExampleRecord:
      type: object
      required:
        - wordId
        - lang
        - japanese
        - translation
        - source
      properties:
        wordId:
          type: string
        lang:
          $ref: '#/components/schemas/LanguageCode'
        japanese:
          type: string
        translation:
          type: string
        source:
          type: string
    DetailedTranslationUpdate:
      allOf:
        - $ref: '#/components/schemas/ReviewMetadata'
        - type: object
          required:
            - id
            - wordId
            - lang
            - definitions
            - sources
            - sourceType
            - status
            - createdAt
            - updatedAt
            - batchId
            - supersedesUpdateId
          properties:
            id:
              type: integer
            wordId:
              type: string
            lang:
              $ref: '#/components/schemas/LanguageCode'
            definitions:
              type: array
              items:
                type: string
            sources:
              type: array
              items:
                type: string
