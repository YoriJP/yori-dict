name: Deploy to Railway

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull LFS data files
        run: git lfs pull

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SQLite database
        run: bun run build:db

      - name: Run tests
        run: bun test

      - name: Verify dictionary integrity
        run: |
          bun run verify:dict data/core.json --fail-on-issues
          bun run verify:dict data/lang/en.json --fail-on-issues
          bun run verify:dict data/lang/de.json --fail-on-issues
          bun run verify:dict data/lang/ko.json --fail-on-issues
          bun run verify:dict data/lang/zh-cn.json --fail-on-issues
          bun run verify:dict data/lang/zh-tw.json --fail-on-issues

  deploy:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_ID }}
